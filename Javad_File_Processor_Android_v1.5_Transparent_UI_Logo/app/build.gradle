plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forsite.javadprocessor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forsite.javadprocessor'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.5-transparent-ui-logo'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
