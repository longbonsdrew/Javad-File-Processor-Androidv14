name: Build Javad File Processor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not uploaded."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Save finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Javad-File-Processor-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
